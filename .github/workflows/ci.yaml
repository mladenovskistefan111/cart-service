name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
      checks: write # test-reporter publishes a check run
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/dotnet-ci.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0
    with:
      solution: cartservice.sln
      project: src/cartservice.csproj
      test-project: tests/cartservice.tests.csproj

  image:
    needs: [dotnet]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@304e49bb34f2d551ac21f5b26bea067f57da4c5a # v2.0.0
