name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
      checks: write # test-reporter publishes a check run
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/dotnet-ci.yaml@f2a4c94316f81a91672ebe04906c8aa2c06c69e7 # v2.0.1
    with:
      solution: cartservice.sln
      project: src/cartservice.csproj
      test-project: tests/cartservice.tests.csproj

  image:
    needs: [dotnet]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@f2a4c94316f81a91672ebe04906c8aa2c06c69e7 # v2.0.1

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@f2a4c94316f81a91672ebe04906c8aa2c06c69e7 # v2.0.1
