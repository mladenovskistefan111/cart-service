name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
      checks: write # test-reporter publishes a check run
    uses: platform-boutique/platform-demo-workflows/.github/workflows/dotnet-ci.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2
    with:
      solution: cartservice.sln
      project: src/cartservice.csproj
      test-project: tests/cartservice.tests.csproj

  image:
    needs: [dotnet]
    permissions:
      contents: read
      packages: write
    uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-build.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2
